        <style>

                position:absolute;
                opacity: 0%;
            }

            .frames2 {
                width: 100%;
                position:absolute;
                opacity: 0%;
            }
            body{

                display:flex;
                flex-direction:row;
            }
        </style>
    </head>
    <body>
        <div>
            <div style="height:800px;width:450px;position:relative;">
                <img class="frames" src="./asset/SixSix3xHangnails_A01.JPG">

                <img class="frames" src="./asset/SixSix3xHangnails_A08.JPG">
                <img class="frames" src="./asset/SixSix3xHangnails_A09.JPG">
                <img class="frames" src="./asset/SixSix3xHangnails_A10.JPG">
                <img class="frames" src="./asset/SixSix3xHangnails_A11.JPG">

                <img class="frames" src="./asset/SixSix3xHangnails_A14.JPG">
                <img class="frames" src="./asset/SixSix3xHangnails_A15.JPG">
                <img class="frames" src="./asset/SixSix3xHangnails_A16.JPG">
                <img class="frames" src="./asset/SixSix3xHangnails_A17.JPG">

            <div style="width:450px;">
                <input style="width:100%" type="range" min="0" max="26" value="0" class="slider" id="test">
            </div>
        </div>

        <div>
            <div style="height:310px;width:490px;position:relative;">
                <img class="frames2" src="./asset/frame_0_delay-0.13s.gif">
                <img class="frames2" src="./asset/frame_1_delay-0.13s.gif">
                <img class="frames2" src="./asset/frame_2_delay-0.13s.gif">
                <img class="frames2" src="./asset/frame_3_delay-0.13s.gif">
                <img class="frames2" src="./asset/frame_4_delay-0.13s.gif">
                <img class="frames2" src="./asset/frame_5_delay-0.13s.gif">
                <img class="frames2" src="./asset/frame_6_delay-0.13s.gif">
            </div>
            <div style="width:490px;">
                <input style="width:100%" type="range" min="0" max="6" value="0" class="slider" id="test2">
            </div>
        </div>

    </body>
</html>
<script>
    const test = document.getElementById("test");
    test.addEventListener("input", function(){
        const currVal = this.value;
        const frames = document.getElementsByClassName("frames");
        for (let i = 0; i < frames.length; i++) {
            if(i == currVal) {
                frames[i].style.opacity = "100%";
            } else {
                frames[i].style.opacity = "0%";
            }
        }
    });
    test.dispatchEvent(new Event("input"));

    const test2 = document.getElementById("test2");
    test2.addEventListener("input", function(){
        const currVal = this.value;
        const frames = document.getElementsByClassName("frames2");
        for (let i = 0; i < frames.length; i++) {
            if(i == currVal) {
                frames[i].style.opacity = "100%";
            } else {
                frames[i].style.opacity = "0%";
            }
        }
    });
    test2.dispatchEvent(new Event("input"));

    document.addEventListener('mousemove', function(event) {
        const x = event.clientX
        const maxWidth = document.body.clientWidth;
        test.value = Math.floor(x/(maxWidth/26));
        test.dispatchEvent(new Event("input"));

        test2.value = Math.floor(x/(maxWidth/6));
        test2.dispatchEvent(new Event("input"));
    })
</script>
